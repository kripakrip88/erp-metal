name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Причина запуска'
        required: false
        default: 'Ручной деплой'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/erp-metal-staging
            git pull origin develop
            npm install --production
            set -a; [ -f .env ] && source .env; set +a
            npx prisma migrate deploy
            npx prisma generate
            bash deploy.sh
            node scripts/emergency-reset-staging.js
            node -e "
              const { PrismaClient } = require('@prisma/client');
              const p = new PrismaClient();
              p.materialDefinition.count({ where: { materialDomain: 'FASTENER', deletedAt: null } })
                .then(n => { console.log('Fasteners in DB:', n); process.exit(n > 0 ? 0 : 1); })
                .catch(() => process.exit(1))
                .finally(() => p.\$disconnect());
            " || node scripts/import-metiz.js IMPORT_METIZ_FINAL.csv

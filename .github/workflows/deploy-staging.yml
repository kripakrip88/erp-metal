name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Причина запуска'
        required: false
        default: 'Ручной деплой'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/erp-metal-staging
            git pull origin develop
            npm install --production
            set -a; [ -f .env ] && source .env; set +a
            npx prisma migrate deploy
            npx prisma generate
            bash deploy.sh
            node scripts/emergency-reset-staging.js
            node -e "
              const { PrismaClient } = require('@prisma/client');
              const p = new PrismaClient();
              p.company.findFirst()
                .then(co => {
                  if (!co) { console.log('No company — will import'); return 0; }
                  return p.materialDefinition.count({ where: { companyId: co.id, materialDomain: 'FASTENER', deletedAt: null } });
                })
                .then(n => { console.log('Fasteners in DB (current company):', n); process.exit(n > 0 ? 0 : 1); })
                .catch(() => process.exit(1))
                .finally(() => p.\$disconnect());
            " || node scripts/import-metiz.js IMPORT_METIZ_FINAL.csv
            # Allow large file uploads (PDFs, specs) through nginx
            NGINX_CONF=$(nginx -T 2>/dev/null | grep -o 'configuration file [^ ]*' | awk '{print $3}' | head -1)
            SITES_CONF=$(find /etc/nginx/sites-enabled /etc/nginx/conf.d -type f 2>/dev/null | head -1)
            TARGET=${SITES_CONF:-$NGINX_CONF}
            if [ -n "$TARGET" ] && ! grep -q "client_max_body_size 100m" "$TARGET"; then
              sed -i 's/client_max_body_size [^;]*/client_max_body_size 100m/g' "$TARGET"
              grep -q "client_max_body_size" "$TARGET" || sed -i '/^http {/a\\    client_max_body_size 100m;' /etc/nginx/nginx.conf
              nginx -t && nginx -s reload && echo "nginx: client_max_body_size set to 100m"
            fi

name: Reset Staging Admin Password

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email пользователя'
        required: true
        type: string

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset password on staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/erp-metal-staging
            node scripts/create-or-reset-admin.js "${{ github.event.inputs.email }}" "${{ secrets.STAGING_ADMIN_PASSWORD }}"

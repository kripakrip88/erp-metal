name: Configure AI Polygon

on:
  workflow_run:
    workflows: ["Deploy to Production", "Deploy to Staging"]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Причина запуска'
        required: false
        default: 'Ручная настройка'

jobs:
  configure:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Прописать IMAP-реквизиты и перезапустить AI Polygon
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: AI_IMAP_USER,AI_IMAP_PASS,AI_IMAP_HOST
          script: |
            echo "=== Ищем директорию AI Polygon ==="
            POLYGON_DIR=""
            for dir in \
              /var/www/metalpro-ai-polygon \
              /root/metalpro-ai-polygon \
              /opt/metalpro-ai-polygon \
              /home/deploy/metalpro-ai-polygon \
              /srv/metalpro-ai-polygon; do
              if [ -d "$dir" ]; then
                POLYGON_DIR="$dir"
                echo "Найдено: $POLYGON_DIR"
                break
              fi
            done

            if [ -z "$POLYGON_DIR" ]; then
              echo "Поиск через find..."
              POLYGON_DIR=$(find /var /root /opt /home /srv -maxdepth 4 -name "docker-compose.yml" 2>/dev/null | xargs grep -l "metalpro\|ai-polygon" 2>/dev/null | head -1 | xargs dirname 2>/dev/null)
              echo "Найдено через find: $POLYGON_DIR"
            fi

            if [ -z "$POLYGON_DIR" ]; then
              echo "ОШИБКА: Директория AI Polygon не найдена"
              exit 1
            fi

            ENV_FILE="$POLYGON_DIR/.env"
            echo "=== Обновляем $ENV_FILE ==="

            touch "$ENV_FILE"

            upsert_env() {
              local key="$1"
              local val="$2"
              if [ -z "$val" ]; then return; fi
              if grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
                echo "Обновлено: $key"
              else
                echo "${key}=${val}" >> "$ENV_FILE"
                echo "Добавлено: $key"
              fi
            }

            upsert_env "IMAP_HOST" "${AI_IMAP_HOST:-imap.mail.ru}"
            upsert_env "IMAP_USER" "$AI_IMAP_USER"
            upsert_env "IMAP_PASS" "$AI_IMAP_PASS"
            upsert_env "SMTP_HOST" "smtp.mail.ru"
            upsert_env "SMTP_USER" "$AI_IMAP_USER"
            upsert_env "SMTP_PASS" "$AI_IMAP_PASS"

            echo "=== Перезапускаем сервис ==="

            # Пробуем PM2 с разными именами
            RESTARTED=0
            for pname in metalpro-ai-polygon metalpro-ai-polygon-backend ai-polygon backend; do
              if pm2 describe "$pname" > /dev/null 2>&1; then
                echo "PM2 restart: $pname"
                pm2 restart "$pname"
                RESTARTED=1
                break
              fi
            done

            # Если PM2 не сработал — пробуем docker-compose
            if [ "$RESTARTED" -eq 0 ] && [ -f "$POLYGON_DIR/docker-compose.yml" ]; then
              echo "Docker-compose restart..."
              cd "$POLYGON_DIR"
              docker-compose restart backend 2>/dev/null || docker-compose up -d 2>/dev/null
              RESTARTED=1
            fi

            if [ "$RESTARTED" -eq 0 ]; then
              echo "WARN: Не удалось найти PM2 процесс или docker-compose. .env обновлён, перезапустите вручную."
            fi

            echo "=== Готово ==="
            echo "IMAP_USER прописан: $AI_IMAP_USER"
            echo "IMAP_HOST: ${AI_IMAP_HOST:-imap.mail.ru}"
        env:
          AI_IMAP_USER: ${{ secrets.AI_IMAP_USER }}
          AI_IMAP_PASS: ${{ secrets.AI_IMAP_PASS }}
          AI_IMAP_HOST: ${{ secrets.AI_IMAP_HOST }}

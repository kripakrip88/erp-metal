name: Configure AI Polygon

# Запускается:
# 1. Автоматически после каждого деплоя на staging или prod
# 2. Вручную из GitHub → Actions → "Configure AI Polygon" → Run workflow
on:
  workflow_run:
    workflows: ["Deploy to Production", "Deploy to Staging"]
    types: [completed]
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Прописать IMAP-реквизиты и перезапустить AI Polygon
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: AI_IMAP_USER,AI_IMAP_PASS
          script: |
            echo "====== PM2 LIST ======"
            pm2 list

            echo "====== DOCKER CONTAINERS ======"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>/dev/null || echo "docker не найден"

            echo "====== ПОИСК ДИРЕКТОРИИ ======"
            POLYGON_DIR=""
            for dir in \
              /var/www/metalpro-ai-polygon \
              /root/metalpro-ai-polygon \
              /opt/metalpro-ai-polygon \
              /home/deploy/metalpro-ai-polygon \
              /srv/metalpro-ai-polygon \
              /var/www/ai-polygon; do
              if [ -d "$dir" ]; then
                POLYGON_DIR="$dir"
                echo "Найдено: $POLYGON_DIR"
                break
              fi
            done

            if [ -z "$POLYGON_DIR" ]; then
              echo "Поиск через find..."
              POLYGON_DIR=$(find /var /root /opt /home /srv -maxdepth 5 \( -name ".env" -o -name "docker-compose.yml" \) 2>/dev/null | xargs grep -l "IMAP\|metalpro\|ai.polygon" 2>/dev/null | head -1 | xargs dirname 2>/dev/null)
              echo "Найдено через find: $POLYGON_DIR"
            fi

            if [ -z "$POLYGON_DIR" ]; then
              echo "ОШИБКА: Директория не найдена"
              exit 1
            fi

            echo "====== ОБНОВЛЯЕМ .env в $POLYGON_DIR ======"
            ENV_FILE="$POLYGON_DIR/.env"
            touch "$ENV_FILE"

            upsert() {
              local k="$1" v="$2"
              [ -z "$v" ] && return
              if grep -q "^${k}=" "$ENV_FILE" 2>/dev/null; then
                sed -i "s|^${k}=.*|${k}=${v}|" "$ENV_FILE"
                echo "  Обновлено: $k"
              else
                echo "${k}=${v}" >> "$ENV_FILE"
                echo "  Добавлено: $k"
              fi
            }

            upsert "IMAP_HOST" "imap.mail.ru"
            upsert "IMAP_USER" "$AI_IMAP_USER"
            upsert "IMAP_PASS" "$AI_IMAP_PASS"
            upsert "SMTP_HOST" "smtp.mail.ru"
            upsert "SMTP_USER" "$AI_IMAP_USER"
            upsert "SMTP_PASS" "$AI_IMAP_PASS"

            echo ""
            echo "IMAP_USER = $AI_IMAP_USER"
            echo "IMAP_HOST = imap.mail.ru"

            echo "====== ДИАГНОСТИКА ПОРТА 4000 ======"
            echo "Что сейчас на порту 4000:"
            lsof -i:4000 2>/dev/null || ss -tlnp sport = :4000 2>/dev/null || echo "lsof/ss недоступны"

            echo "PM2 процессы:"
            pm2 list --no-color 2>/dev/null | head -30

            echo "====== ОСВОБОЖДАЕМ ПОРТ 4000 ======"
            # Найти PM2-процесс по PID порта 4000 и удалить его (чтобы не перезапускал)
            PORT_PID=$(lsof -ti:4000 2>/dev/null | head -1)
            if [ -n "$PORT_PID" ]; then
              echo "PID на порту 4000: $PORT_PID"
              echo "Команда: $(cat /proc/$PORT_PID/cmdline 2>/dev/null | tr '\0' ' ' | head -c 200)"
              # Найти имя PM2-процесса по PID через pm2 jlist + node
              AI_PM2_NAME=$(pm2 jlist 2>/dev/null | node -e "
                let d=''; process.stdin.on('data',c=>d+=c);
                process.stdin.on('end',()=>{
                  try{ const l=JSON.parse(d); const p=l.find(p=>p.pid===$PORT_PID);
                  if(p) process.stdout.write(p.name); }catch(e){}
                });" 2>/dev/null)
              if [ -n "$AI_PM2_NAME" ]; then
                echo "PM2 имя процесса: $AI_PM2_NAME — удаляем"
                pm2 delete "$AI_PM2_NAME" 2>/dev/null || true
                pm2 save --force 2>/dev/null || true
              else
                echo "PM2 процесс не найден по PID — удаляем по известным именам"
                for pname in metalpro-ai-polygon metalpro-ai-polygon-backend ai-polygon backend polygon; do
                  pm2 delete "$pname" 2>/dev/null || true
                done
                pm2 save --force 2>/dev/null || true
              fi
            fi
            # Убить всё на порту 4000
            fuser -k 4000/tcp 2>/dev/null || lsof -ti:4000 | xargs kill -9 2>/dev/null || true
            sleep 3
            echo "Порт 4000 после очистки: $(lsof -i:4000 2>/dev/null || echo 'свободен')"

            echo "====== ПЕРЕЗАПУСК ЧЕРЕЗ DOCKER ======"
            if [ -f "$POLYGON_DIR/docker-compose.yml" ]; then
              cd "$POLYGON_DIR"

              echo "====== GIT: принудительно берём latest main ======"
              git fetch origin main 2>&1
              git reset --hard origin/main 2>&1
              echo "Текущий коммит:"
              git log --oneline -3 2>/dev/null || true

              echo "====== ПАТЧ: вложения + HTML-тело письма ======"
              echo "" | base64 -d > "$POLYGON_DIR/backend/src/email-copilot/imap.service.ts"
              echo "  imap.service.ts ✓"
              export SCHEMA_FILE="$POLYGON_DIR/backend/prisma/schema.prisma"
              export SVC_FILE="$POLYGON_DIR/backend/src/email-copilot/email-copilot.service.ts"
              node -e "
              const fs=require('fs');
              const sf=process.env.SCHEMA_FILE;
              let s=fs.readFileSync(sf,'utf8');
              let schemaOk=s.includes('bodyHtml String?')&&s.includes('attachments Json?');
              if(!schemaOk){
                if(!s.includes('attachments Json?'))
                  s=s.replace('  updatedAt DateTime @updatedAt','  bodyHtml String?\n  attachments Json?\n  updatedAt DateTime @updatedAt');
                else if(!s.includes('bodyHtml String?'))
                  s=s.replace('  attachments Json?','  bodyHtml String?\n  attachments Json?');
                fs.writeFileSync(sf,s);console.log('  schema.prisma ✓');
              }else{console.log('  schema.prisma already patched');}
              const vf=process.env.SVC_FILE;
              let v=fs.readFileSync(vf,'utf8');
              let svcOk=v.includes('bodyHtml: raw.bodyHtml');
              if(!svcOk){
                if(v.includes('attachments: raw.attachments'))
                  v=v.replace('attachments: raw.attachments && raw.attachments.length ? raw.attachments : undefined,','bodyHtml: raw.bodyHtml || undefined,\n        attachments: raw.attachments && raw.attachments.length ? raw.attachments : undefined,');
                else
                  v=v.replace('        bodyText: raw.bodyText,','        bodyText: raw.bodyText,\n        bodyHtml: raw.bodyHtml || undefined,\n        attachments: raw.attachments && raw.attachments.length ? raw.attachments : undefined,');
                fs.writeFileSync(vf,v);console.log('  email-copilot.service.ts ✓');
              }else{console.log('  service already patched');}
              "

              echo "====== Удаляем застрявший контейнер ======"
              docker rm -f metalpro-ai-polygon-backend-1 2>/dev/null || true
              sleep 2

              echo "====== Docker compose --build --force-recreate ======"
              docker compose up -d --build --force-recreate backend
              echo "Контейнер пересобран и запущен ✓"

              echo "Ожидаем запуск (20 сек)..."
              sleep 20
              echo "Статус:"
              docker ps --filter "name=metalpro-ai-polygon-backend" --format "{{.Names}} | {{.Status}}"

            else
              echo "ОШИБКА: docker-compose.yml не найден в $POLYGON_DIR"
              exit 1
            fi

            echo "====== ПРОВЕРКА ВНУТРИ КОНТЕЙНЕРА ======"
            CONTAINER=$(docker ps --filter "name=metalpro-ai-polygon-backend" --format "{{.Names}}" | head -1)
            if [ -n "$CONTAINER" ]; then
              docker exec "$CONTAINER" printenv IMAP_HOST 2>/dev/null || echo "  IMAP_HOST: не задан"
              docker exec "$CONTAINER" printenv IMAP_USER 2>/dev/null || echo "  IMAP_USER: не задан"
              IMAP_PASS_IN=$(docker exec "$CONTAINER" printenv IMAP_PASS 2>/dev/null)
              if [ -n "$IMAP_PASS_IN" ]; then
                echo "  IMAP_PASS: задан (длина: ${#IMAP_PASS_IN} символов)"
              else
                echo "  IMAP_PASS: НЕ ЗАДАН!"
              fi

              echo "====== ТЕСТ IMAP СОЕДИНЕНИЯ ======"
              docker exec "$CONTAINER" sh -c \
                "node -e \"const {ImapFlow}=require('imapflow');const c=new ImapFlow({host:process.env.IMAP_HOST,port:993,secure:true,auth:{user:process.env.IMAP_USER,pass:process.env.IMAP_PASS},logger:false});c.connect().then(()=>{console.log('IMAP OK');c.logout();}).catch(e=>console.log('IMAP ERR:',e.message));\"" \
                2>&1 || echo "Тест IMAP не удался"
            else
              echo "Контейнер не найден — проверьте docker ps"
            fi

            echo "====== ГОТОВО ======"
        env:
          AI_IMAP_USER: ${{ secrets.AI_IMAP_USER }}
          AI_IMAP_PASS: ${{ secrets.AI_IMAP_PASS }}

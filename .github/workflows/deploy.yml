name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/erp-metal
            git pull origin main
            npm install --production
            set -a; [ -f .env ] && source .env; set +a
            npx prisma migrate deploy
            npx prisma generate
            bash deploy.sh
            # Allow large file uploads (PDFs, specs) through nginx
            SITES_CONF=$(find /etc/nginx/sites-enabled /etc/nginx/conf.d -type f 2>/dev/null | head -1)
            if [ -n "$SITES_CONF" ] && ! grep -q "client_max_body_size 100m" "$SITES_CONF"; then
              sed -i 's/client_max_body_size [^;]*/client_max_body_size 100m/g' "$SITES_CONF"
              grep -q "client_max_body_size" "$SITES_CONF" || sed -i '/^http {/a\\    client_max_body_size 100m;' /etc/nginx/nginx.conf
              nginx -t && nginx -s reload && echo "nginx: client_max_body_size set to 100m"
            fi
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МеталлПро ERP — Email Copilot</title>
<script src="nav.js"></script>
<style>
.inbox-layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - var(--topbarh));}
.list-panel{width:320px;flex-shrink:0;border-right:1px solid var(--brd);display:flex;flex-direction:column;background:var(--panel);}
.list-filters{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--brd);flex-wrap:wrap;}
.mail-list{flex:1;overflow-y:auto;}
.mail-item{padding:12px 14px;border-bottom:1px solid var(--brd);cursor:pointer;transition:background .1s;}
.mail-item:hover{background:var(--hov);}
.mail-item.on{background:rgba(59,130,246,.08);border-left:3px solid var(--blue);}
.mail-from{font-weight:600;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:4px;}
.mail-from-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mail-time{font-size:11px;color:var(--txts);flex-shrink:0;}
.mail-subject{font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txts);}
.mail-badges{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
.empty-list{text-align:center;padding:40px 16px;color:var(--txts);}
.detail-panel{flex:1;overflow-y:auto;background:var(--bg);}
.detail-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--txts);font-size:14px;}
.detail-content{padding:20px;max-width:860px;}
.detail-hdr{background:var(--panel);border:1px solid var(--brd);border-radius:8px;padding:16px;margin-bottom:12px;}
.detail-subject{font-size:16px;font-weight:700;margin-bottom:8px;}
.detail-meta{font-size:12px;color:var(--txts);margin-bottom:8px;}
.detail-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.section-block{background:var(--panel);border:1px solid var(--brd);border-radius:8px;padding:14px;margin-bottom:12px;}
.section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--txts);margin-bottom:8px;}
.summary-text{font-size:13px;line-height:1.6;}
.body-main{font-size:12.5px;line-height:1.7;color:var(--txt);white-space:pre-wrap;word-break:break-word;}
.body-quoted{font-size:12px;color:var(--txts);border-left:3px solid var(--brd);padding:8px 10px;margin-top:10px;white-space:pre-wrap;word-break:break-word;line-height:1.6;background:var(--card);border-radius:0 4px 4px 0;}
.body-sep{border:none;border-top:1px dashed var(--brd);margin:10px 0;}
.extracted-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.extracted-item{background:var(--card);border-radius:5px;padding:8px 10px;}
.extracted-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--txts);margin-bottom:2px;}
.extracted-value{font-size:13px;}
.drafts-list{display:flex;flex-direction:column;gap:8px;}
.draft-card{border:2px solid var(--brd);border-radius:7px;padding:12px;cursor:pointer;transition:all .12s;background:var(--card);}
.draft-card:hover{border-color:var(--brdl);}
.draft-card.on{border-color:var(--blue);background:rgba(59,130,246,.06);}
.draft-strategy{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--txts);margin-bottom:6px;}
.draft-preview{font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.attach-list{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.attach-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--card);border:1px solid var(--brd);border-radius:6px;font-size:12.5px;}
.attach-icon{font-size:15px;flex-shrink:0;}
.attach-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.attach-size{font-size:11px;color:var(--txts);flex-shrink:0;font-family:var(--ffm);}
.reply-editor{background:var(--panel);border:1px solid var(--brd);border-radius:8px;padding:14px;margin-bottom:12px;}
.reply-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--txts);margin-bottom:8px;}
.reply-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;}
.btn-reanalyze{margin-left:auto;}
.spinner{display:inline-block;width:11px;height:11px;border:2px solid rgba(59,130,246,.3);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}
.last-update{font-size:11.5px;color:var(--txts);}
</style>
</head>
<body>
<div class="shell">
  <aside class="sb" id="erp-nav"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Email Copilot</div>
      <div class="topbar-right">
        <span class="last-update" id="last-update"></span>
        <button class="btn btn-secondary btn-sm" onclick="pollMail()">↻ Проверить почту</button>
      </div>
    </div>
    <div class="inbox-layout">
      <div class="list-panel">
        <div class="list-filters">
          <button class="filter-pill on" onclick="setFilter('status','pending',this)">Новые</button>
          <button class="filter-pill" onclick="setFilter('status','',this)">Все</button>
          <button class="filter-pill" onclick="setFilter('intent','RFQ',this)">RFQ</button>
        </div>
        <div class="mail-list" id="mail-list"><div class="empty-list">Загрузка...</div></div>
      </div>
      <div class="detail-panel" id="detail-panel">
        <div class="detail-empty">Выберите письмо</div>
      </div>
    </div>
  </div>
</div>

<script>
ERP.init('email');

// AI API проксируется через erp-metal backend (устраняет CORS и Mixed Content)
var AI_API = (window.AI_API_URL || '');
var currentFilter = { status: 'pending', intent: '' };
var selectedId = null;
var messages = [];
var currentDrafts = [];

function fmtTime(d) {
  if (!d) return '';
  var dt = new Date(d), now = new Date();
  if (dt.toDateString() === now.toDateString())
    return dt.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
  return dt.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' });
}

function intentBadge(v) {
  if (!v) return '';
  var m = { RFQ:'b-rfq', ORDER:'b-order', QUESTION:'b-question', COMPLAINT:'b-complaint', SPAM:'b-spam', OTHER:'b-other' };
  return '<span class="badge '+(m[v]||'b-other')+'">'+v+'</span>';
}
function priorityBadge(v) {
  if (!v) return '';
  var m = { critical:'b-danger', urgent:'b-urgent', normal:'b-normal', low:'b-low' };
  return '<span class="badge '+(m[v]||'b-normal')+'">'+v.toUpperCase()+'</span>';
}
function statusBadge(v) {
  if (!v) return '';
  var m = { pending:'b-pending', replied:'b-replied', archived:'b-archived' };
  return '<span class="badge '+(m[v]||'b-pending')+'">'+v+'</span>';
}

function setFilter(key, val, btn) {
  document.querySelectorAll('.filter-pill').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  if (key==='status') { currentFilter.status=val; currentFilter.intent=''; }
  else { currentFilter.intent=val; currentFilter.status=''; }
  loadMessages();
}

async function loadMessages() {
  var list = document.getElementById('mail-list');
  list.innerHTML = '<div class="empty-list">Загрузка...</div>';
  try {
    var url = AI_API + '/api/email-copilot/inbox';
    var qs = [];
    if (currentFilter.status) qs.push('status=' + currentFilter.status);
    if (currentFilter.intent) qs.push('intent=' + currentFilter.intent);
    if (qs.length) url += '?' + qs.join('&');
    var r = await fetch(url);
    var data = await r.json();
    messages = Array.isArray(data.messages) ? data.messages : (Array.isArray(data) ? data : []);
    renderList();
    updateLastUpdate();
  } catch(e) {
    list.innerHTML = '<div class="empty-list">AI-сервис недоступен<br><small>Порт 4000</small></div>';
  }
}

function renderList() {
  var list = document.getElementById('mail-list');
  if (!messages.length) { list.innerHTML = '<div class="empty-list">Писем нет</div>'; return; }
  list.innerHTML = messages.map(function(m){
    return '<div class="mail-item'+(m.id===selectedId?' on':'')+'" onclick="selectMessage(\''+m.id+'\')">'+
      '<div class="mail-from">'+
        '<span class="mail-from-name">'+ERP.esc(m.fromAddress||'—')+'</span>'+
        '<span class="mail-time">'+fmtTime(m.receivedAt)+'</span>'+
      '</div>'+
      '<div class="mail-subject">'+ERP.esc(m.subject||'(без темы)')+'</div>'+
      '<div class="mail-badges">'+intentBadge(m.aiIntent)+priorityBadge(m.aiPriority)+'</div>'+
    '</div>';
  }).join('');
}

function selectMessage(id) {
  selectedId = id;
  renderList();
  var msg = messages.find(function(m){ return m.id===id; });
  if (msg) renderDetail(msg);
}

function formatBody(text) {
  if (!text) return '<div class="body-main">(пусто)</div>';
  var lines = text.split('\n');
  var mainEnd = lines.length;
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i].trim();
    if (/^From:/i.test(l)||/^От:/i.test(l)||/^_{5,}/.test(l)||/^-{5,}/.test(l)||/^>{3,}/.test(l)) {
      mainEnd = i; break;
    }
  }
  var main = lines.slice(0, mainEnd).join('\n').trim();
  var quoted = lines.slice(mainEnd).join('\n').trim();
  var html = '';
  if (main) html += '<div class="body-main">'+ERP.esc(main)+'</div>';
  if (quoted) html += '<hr class="body-sep"><div class="body-quoted">'+ERP.esc(quoted)+'</div>';
  return html || '<div class="body-main">'+ERP.esc(text)+'</div>';
}

function renderDetail(msg) {
  currentDrafts = msg.aiDrafts || [];
  var panel = document.getElementById('detail-panel');
  var confidence = msg.aiConfidence != null ? Math.round(msg.aiConfidence * 100) : 0;

  var attachmentsHtml = "";
  if (msg.attachments && msg.attachments.length) {
    attachmentsHtml = "<div class=\"section-block\"><div class=\"section-title\">Вложения (" + msg.attachments.length + ")</div><div class=\"attach-list\">" +
      msg.attachments.map(function(a){
        var icon = a.contentType.indexOf("image/") === 0 ? "🖼" : a.contentType.indexOf("pdf") >= 0 ? "📄" : a.contentType.indexOf("sheet") >= 0 || a.contentType.indexOf("excel") >= 0 ? "📊" : "📎";
        var size = a.size > 1048576 ? (a.size/1048576).toFixed(1)+" МБ" : a.size > 1024 ? Math.round(a.size/1024)+" КБ" : a.size+" Б";
        return "<div class=\"attach-item\"><span class=\"attach-icon\">" + icon + "</span><span class=\"attach-name\">" + ERP.esc(a.filename) + "</span><span class=\"attach-size\">" + size + "</span></div>";
      }).join("") + "</div></div>";
  }
  var itemsHtml = '';
  if (msg.aiExtracted && msg.aiExtracted.items && msg.aiExtracted.items.length) {
    itemsHtml = '<div class="section-block"><div class="section-title">Извлечённые позиции</div>' +
      '<table><thead><tr><th>Наименование</th><th>Кол-во</th><th>Ед.</th><th>Материал</th></tr></thead><tbody>' +
      msg.aiExtracted.items.map(function(item){
        return '<tr><td>'+ERP.esc(item.name||item.description||'—')+'</td><td>'+ERP.esc(item.qty||item.quantity||'—')+'</td><td>'+ERP.esc(item.unit||'—')+'</td><td>'+ERP.esc(item.material||'—')+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }

  var ex = msg.aiExtracted || {};
  var extractedHtml = '';
  if (ex.company||ex.contact||ex.deadline||ex.currency) {
    extractedHtml = '<div class="section-block"><div class="section-title">Контрагент</div><div class="extracted-grid">' +
      (ex.company?'<div class="extracted-item"><div class="extracted-label">Компания</div><div class="extracted-value">'+ERP.esc(ex.company)+'</div></div>':'')+
      (ex.contact?'<div class="extracted-item"><div class="extracted-label">Контакт</div><div class="extracted-value">'+ERP.esc(ex.contact)+'</div></div>':'')+
      (ex.deadline?'<div class="extracted-item"><div class="extracted-label">Срок</div><div class="extracted-value">'+ERP.esc(ex.deadline)+'</div></div>':'')+
      (ex.currency?'<div class="extracted-item"><div class="extracted-label">Валюта</div><div class="extracted-value">'+ERP.esc(ex.currency)+'</div></div>':'')+
    '</div></div>';
  }

  var draftsHtml = '';
  if (currentDrafts.length) {
    draftsHtml = '<div class="section-block"><div class="section-title">Варианты ответа ('+currentDrafts.length+') — нажмите для вставки</div><div class="drafts-list">' +
      currentDrafts.map(function(d,i){
        return '<div class="draft-card" id="draft-'+i+'" onclick="selectDraft('+i+')">'+
          '<div class="draft-strategy">'+ERP.esc(d.strategy||('Вариант '+(i+1)))+'</div>'+
          '<div class="draft-preview">'+ERP.esc(d.body||'')+'</div>'+
        '</div>';
      }).join('')+'</div></div>';
  }

  var rfqBtn = msg.aiSuggestRfq
    ? '<button class="btn btn-success btn-sm" onclick="createRfqFromEmail(\''+ERP.esc(msg.id)+'\')">+ Заявка на КП</button>'
    : '';

  panel.innerHTML =
    '<div class="detail-content">'+
      '<div class="detail-hdr">'+
        '<div class="detail-subject">'+ERP.esc(msg.subject||'(без темы)')+'</div>'+
        '<div class="detail-meta">От: '+ERP.esc(msg.fromAddress||'—')+' · '+(msg.receivedAt?new Date(msg.receivedAt).toLocaleString('ru-RU'):'')+'</div>'+
        '<div class="detail-badges">'+intentBadge(msg.aiIntent)+priorityBadge(msg.aiPriority)+(confidence?'<span class="badge b-secondary">'+confidence+'%</span>':'')+(msg.aiModelUsed?'<span class="badge b-secondary">'+ERP.esc(msg.aiModelUsed)+'</span>':'')+statusBadge(msg.status)+'</div>'+
      '</div>'+
      (msg.aiSummary&&confidence>0?'<div class="section-block"><div class="section-title">AI-резюме</div><div class="summary-text">'+ERP.esc(msg.aiSummary)+'</div></div>':'')+
      '<div class="section-block"><div class="section-title">Текст письма</div>'+formatBody(msg.bodyText)+'</div>'+
      attachmentsHtml+itemsHtml+extractedHtml+draftsHtml+
      '<div class="reply-editor">'+
        '<div class="reply-label">Редактор ответа</div>'+
        '<textarea id="reply-textarea" placeholder="Выберите вариант ответа выше или введите текст..."></textarea>'+
        '<div class="reply-actions">'+
          '<button class="btn btn-primary btn-sm" onclick="sendReply(\''+ERP.esc(msg.id)+'\',\''+ERP.esc(msg.messageId||'')+'\')">Отправить</button>'+
          rfqBtn+
          '<button class="btn btn-danger btn-sm" onclick="archiveMail(\''+ERP.esc(msg.id)+'\')">В архив</button>'+
          '<button class="btn btn-secondary btn-sm btn-reanalyze" id="reanalyze-btn" onclick="reanalyzeEmail(\''+ERP.esc(msg.id)+'\')">↻ '+(confidence?'Обновить':'Анализировать')+'</button>'+
        '</div>'+
      '</div>'+
    '</div>';
}

function selectDraft(index) {
  document.querySelectorAll('.draft-card').forEach(function(c,i){ c.classList.toggle('on', i===index); });
  var ta = document.getElementById('reply-textarea');
  if (ta && currentDrafts[index]) {
    ta.value = currentDrafts[index].body || '';
    // Scroll the detail panel to show the reply editor
    var panel = document.getElementById('detail-panel');
    if (panel) panel.scrollTop = panel.scrollHeight;
    setTimeout(function() { ta.focus(); ta.setSelectionRange(0, 0); }, 50);
    ERP.toast('Вариант вставлен в редактор', 'success');
  }
}

async function reanalyzeEmail(id) {
  var btn = document.getElementById('reanalyze-btn');
  if (btn) { btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Анализ...'; }
  try {
    var r = await fetch(AI_API + '/api/email-copilot/analyze/'+id, { method:'POST' });
    if (!r.ok) throw new Error('Ошибка анализа: ' + r.status);
    ERP.toast('Анализ завершён', 'success');
    await loadMessages();
    var updated = messages.find(function(m){ return m.id===id; });
    if (updated) renderDetail(updated);
  } catch(e) {
    ERP.toast(e.message, 'error');
    if (btn) { btn.disabled=false; btn.textContent='↻ Переанализировать'; }
  }
}

async function sendReply(id, messageId) {
  var ta = document.getElementById('reply-textarea');
  var body = ta ? ta.value.trim() : '';
  if (!body) { ERP.toast('Введите текст ответа', 'error'); return; }
  try {
    var r = await fetch(AI_API + '/api/email-copilot/reply', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ messageId:messageId, replyBody:body, sentBy:'manager' }),
    });
    if (!r.ok) throw new Error('Ошибка отправки');
    ERP.toast('Ответ отправлен', 'success');
    loadMessages();
  } catch(e) { ERP.toast(e.message, 'error'); }
}

async function archiveMail(id) {
  try {
    var r = await fetch(AI_API + '/api/email-copilot/archive/'+id, { method:'POST' });
    if (!r.ok) throw new Error('Ошибка');
    ERP.toast('Письмо в архиве', 'success');
    selectedId = null;
    document.getElementById('detail-panel').innerHTML = '<div class="detail-empty">Выберите письмо</div>';
    loadMessages();
  } catch(e) { ERP.toast(e.message, 'error'); }
}

async function createRfqFromEmail(id) {
  var title = prompt('Название объекта для КП:');
  if (!title) return;
  try {
    var r = await fetch(AI_API + '/api/email-copilot/create-rfq', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ messageId:id, title:title }),
    });
    var data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Ошибка');
    ERP.toast('Заявка создана', 'success');
    if (data.orderId && confirm('Перейти в симулятор КП?'))
      window.location.href = 'simulator.html?orderId=' + data.orderId;
  } catch(e) { ERP.toast(e.message, 'error'); }
}

async function pollMail() {
  try {
    var r = await fetch(AI_API + '/api/email-copilot/poll', { method:'POST' });
    var data = await r.json();
    var n = data.received != null ? data.received : (data.newCount != null ? data.newCount : (data.count || 0));
    ERP.toast('Получено: ' + n + ' новых', n>0 ? 'success' : '');
    updateLastUpdate();
    loadMessages();
  } catch(e) { ERP.toast('Сервис недоступен', 'error'); }
}

function updateLastUpdate() {
  var el = document.getElementById('last-update');
  if (el) el.textContent = 'Обновлено: ' + new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
}

loadMessages();
</script>
</body>
</html>

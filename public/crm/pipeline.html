<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — МеталлПро ERP</title>
<script src="../nav.js?v=20260529"></script>
<link rel="stylesheet" href="crm.css?v=20260530">
</head>
<body>
<div class="shell">
  <aside class="sb" id="erp-nav"></aside>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">CRM</span>
      <div class="tb-filter">
        <input type="text" id="search-inp" placeholder="Поиск по названию или клиенту…" oninput="filterCards(this.value)">
        <span class="tb-total" id="total-badge">—</span>
      </div>
    </div>
    <div class="pipeline-wrap" id="pipeline"></div>
  </div>
</div>

<!-- Deal modal -->
<div id="deal-modal-bg" class="dm-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="dm-modal">

    <!-- Header -->
    <div class="dm-header">
      <div class="dm-header-left">
        <div class="dm-order-num" id="dm-num">…</div>
        <div class="dm-order-title" id="dm-title">…</div>
      </div>
      <div class="dm-header-right">
        <div id="dm-status-badge"></div>
        <button class="dm-close" onclick="closeModal()">✕</button>
      </div>
    </div>

    <!-- Stats strip -->
    <div class="dm-stats-strip" id="dm-stats">
      <div class="dm-stat"><span class="dm-stat-lbl">Клиент</span><span class="dm-stat-val" id="dm-client">—</span></div>
      <div class="dm-stat"><span class="dm-stat-lbl">Дата</span><span class="dm-stat-val mono" id="dm-date">—</span></div>
      <div class="dm-stat dm-stat--accent"><span class="dm-stat-lbl">Общий вес</span><span class="dm-stat-val mono" id="dm-weight">—</span></div>
      <div class="dm-stat dm-stat--accent"><span class="dm-stat-lbl">Материалы</span><span class="dm-stat-val mono" id="dm-mat">—</span></div>
      <div class="dm-stat dm-stat--green"><span class="dm-stat-lbl">Итого КП</span><span class="dm-stat-val mono" id="dm-total">—</span></div>
    </div>

    <!-- Two-column body -->
    <div class="dm-body">

      <!-- LEFT: contacts + description -->
      <div class="dm-col-left">

        <!-- Contacts -->
        <div class="dm-section">
          <div class="dm-section-title">Контакты клиента</div>
          <div id="dm-contacts" class="dm-contacts-wrap">
            <span class="dm-placeholder">Загрузка…</span>
          </div>
        </div>

        <!-- Request text -->
        <div class="dm-section" id="dm-desc-section" style="display:none">
          <div class="dm-section-title">Текст запроса</div>
          <div class="dm-description" id="dm-desc"></div>
        </div>

        <!-- No description placeholder -->
        <div class="dm-section" id="dm-no-desc-section" style="display:none">
          <div class="dm-placeholder">Описание не указано</div>
        </div>

      </div>

      <!-- RIGHT: BOM -->
      <div class="dm-col-right">
        <div class="dm-section">
          <div class="dm-section-title" id="dm-bom-title">Состав изделия</div>
          <div id="dm-bom">
            <span class="dm-placeholder">Загрузка…</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="dm-footer">
      <button class="btn btn-secondary btn-sm" onclick="closeModal()">Закрыть</button>
      <button class="btn btn-primary btn-sm" id="dm-calc-btn">Открыть расчёт →</button>
    </div>

  </div>
</div>

<script>
ERP.init('pipeline');

var COLS = [
  { status: 'DRAFT',             label: 'Новый запрос',    hint: 'RFQ получен, не рассмотрен' },
  { status: 'QUOTATION',         label: 'На рассмотрении', hint: 'Анализируем, уточняем ТЗ' },
  { status: 'AWAITING_APPROVAL', label: 'Расчёт цены',     hint: 'Считаем стоимость' },
  { status: 'APPROVED',          label: 'КП отправлено',   hint: 'Ждём ответа клиента' },
  { status: 'PRODUCTION',        label: 'Выиграно ✓',      hint: 'Клиент принял, в работе' },
  { status: 'CANCELLED',         label: 'Потеряно',        hint: 'Отклонено или отменено' },
];

var STATUS_RU = {
  DRAFT:'Новый запрос', QUOTATION:'На рассмотрении', AWAITING_APPROVAL:'Расчёт цены',
  APPROVED:'КП отправлено', PRODUCTION:'В производстве', COMPLETED:'Готово',
  DELIVERED:'Сдан', CANCELLED:'Отменён'
};
var STATUS_CLS = {
  DRAFT:'b-draft', QUOTATION:'b-quotation', AWAITING_APPROVAL:'b-awaiting',
  APPROVED:'b-approved', PRODUCTION:'b-production', COMPLETED:'b-completed',
  DELIVERED:'b-delivered', CANCELLED:'b-cancelled'
};

var allOrders = [];
var filterQ   = '';
var draggingId = null;
var draggingFromStatus = null;
var isDragging = false;

function statusBadge(s) {
  return '<span class="badge '+(STATUS_CLS[s]||'b-draft')+'">'+(STATUS_RU[s]||s)+'</span>';
}
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtNum(n, dec) {
  if (n == null || n === '') return '—';
  return Number(n).toLocaleString('ru-RU',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0});
}
function fmtMoney(n) { return n == null ? '—' : fmtNum(n,0) + ' ₽'; }

/* ── Load ─────────────────────────────────────────────────────────────────── */
async function load() {
  try {
    var r = await ERP.authFetch('/api/orders');
    var data = await r.json();
    allOrders = (Array.isArray(data) ? data : []).filter(function(o){
      return o.status !== 'COMPLETED' && o.status !== 'DELIVERED';
    });
    render();
  } catch(e) { ERP.toast('Ошибка загрузки: ' + e.message, 'error'); }
}

/* ── Render board ─────────────────────────────────────────────────────────── */
function render() {
  var q = filterQ.toLowerCase();
  var pipeline = document.getElementById('pipeline');
  var total = 0;

  pipeline.innerHTML = COLS.map(function(col) {
    var cards = allOrders.filter(function(o){
      if (o.status !== col.status) return false;
      if (!q) return true;
      return (o.title||'').toLowerCase().includes(q) ||
             (o.customerName||'').toLowerCase().includes(q) ||
             (o.orderNumber||'').toLowerCase().includes(q);
    });
    total += cards.length;
    return renderCol(col, cards);
  }).join('');

  document.getElementById('total-badge').textContent = total + ' сделок';
  bindDrag();
}

function renderCol(col, cards) {
  var cardsHtml = cards.length
    ? cards.map(renderCard).join('')
    : '<div class="pl-empty-col">Нет сделок</div>';

  return '<div class="pl-col" data-col="' + col.status + '" ' +
    'title="' + ERP.esc(col.hint) + '" ' +
    'ondragover="onDragOver(event,this)" ' +
    'ondragleave="onDragLeave(event,this)" ' +
    'ondrop="onDrop(event,\'' + col.status + '\')">' +
    '<div class="pl-col-head">' +
      '<div class="pl-col-dot"></div>' +
      '<div class="pl-col-title">' + ERP.esc(col.label) + '</div>' +
      '<div class="pl-col-count">' + cards.length + '</div>' +
    '</div>' +
    '<div class="pl-col-body">' + cardsHtml + '</div>' +
  '</div>';
}

function renderCard(o) {
  var age = daysDiff(o.createdAt);
  var ageStr = age === 0 ? 'сегодня' : age === 1 ? 'вчера' : age + ' д.';
  var asmCount = o._count && o._count.assemblies || 0;

  return '<div class="pl-card" draggable="true" data-id="' + o.id + '" data-status="' + o.status + '">' +
    '<div class="pl-card-num">' + ERP.esc(o.orderNumber || '—') + '</div>' +
    '<div class="pl-card-title">' + ERP.esc(o.title || '(без названия)') + '</div>' +
    (o.customerName ? '<div class="pl-card-customer">' + ERP.esc(o.customerName) + '</div>' : '') +
    '<div class="pl-card-footer">' +
      '<span class="pl-card-age">' + ageStr + '</span>' +
      (asmCount ? '<span class="pl-card-asm">⬡ ' + asmCount + '</span>' : '') +
    '</div>' +
  '</div>';
}

/* ── Drag & drop ──────────────────────────────────────────────────────────── */
function bindDrag() {
  document.querySelectorAll('.pl-card').forEach(function(card) {
    card.addEventListener('mousedown', function() { isDragging = false; });
    card.addEventListener('dragstart', function(e) {
      isDragging = true;
      onDragStart(e, card.dataset.id, card.dataset.status);
    });
    card.addEventListener('click', function() {
      if (!isDragging) openModal(card.dataset.id);
    });
    card.addEventListener('dragend', function() {
      setTimeout(function(){ isDragging = false; }, 50);
    });
  });
}

function onDragStart(e, id, status) {
  draggingId = id;
  draggingFromStatus = status;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(function() {
    var el = document.querySelector('.pl-card[data-id="' + id + '"]');
    if (el) el.classList.add('dragging');
  }, 0);
}

function onDragOver(e, colEl) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  colEl.querySelector('.pl-col-body').classList.add('drag-over');
}

function onDragLeave(e, colEl) {
  if (!colEl.contains(e.relatedTarget)) {
    colEl.querySelector('.pl-col-body').classList.remove('drag-over');
  }
}

async function onDrop(e, targetStatus) {
  e.preventDefault();
  document.querySelectorAll('.pl-col-body').forEach(function(b){ b.classList.remove('drag-over'); });
  document.querySelectorAll('.pl-card.dragging').forEach(function(c){ c.classList.remove('dragging'); });
  if (!draggingId || targetStatus === draggingFromStatus) { draggingId = null; return; }

  try {
    var resp = await ERP.authFetch('/api/orders/' + draggingId + '/status', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: targetStatus }),
    });
    if (!resp.ok) { var err = await resp.json(); throw new Error(err.error || 'Ошибка'); }
    var colLabel = COLS.find(function(c){ return c.status === targetStatus; });
    ERP.toast('Сделка переведена: ' + (colLabel ? colLabel.label : targetStatus), 'success');
    var order = allOrders.find(function(o){ return o.id === draggingId; });
    if (order) order.status = targetStatus;
    render();
  } catch(e) {
    ERP.toast(e.message || 'Ошибка перемещения', 'error');
    render();
  }
  draggingId = null;
}

/* ── Modal ────────────────────────────────────────────────────────────────── */
function openModal(orderId) {
  var bg = document.getElementById('deal-modal-bg');
  bg.style.display = 'flex';
  setTimeout(function(){ bg.classList.add('open'); }, 10);

  // Reset
  document.getElementById('dm-num').textContent    = '…';
  document.getElementById('dm-title').textContent  = '…';
  document.getElementById('dm-status-badge').innerHTML = '';
  document.getElementById('dm-client').textContent = '—';
  document.getElementById('dm-date').textContent   = '—';
  document.getElementById('dm-weight').textContent = '—';
  document.getElementById('dm-mat').textContent    = '—';
  document.getElementById('dm-total').textContent  = '—';
  document.getElementById('dm-contacts').innerHTML = '<span class="dm-placeholder">Загрузка…</span>';
  document.getElementById('dm-bom').innerHTML      = '<span class="dm-placeholder">Загрузка…</span>';
  document.getElementById('dm-desc-section').style.display    = 'none';
  document.getElementById('dm-no-desc-section').style.display = 'none';
  document.getElementById('dm-calc-btn').onclick = function(){
    window.location.href = '../simulator.html?orderId=' + orderId;
  };

  Promise.all([
    ERP.authFetch('/api/orders/' + orderId).then(function(r){ return r.json(); }),
    ERP.authFetch('/api/orders/' + orderId + '/revisions').then(function(r){ return r.json(); }),
  ]).then(function(results) {
    var order    = results[0];
    var revisions = Array.isArray(results[1]) ? results[1] : [];
    var rev  = revisions[0];
    var calc = rev && rev.calculation;
    var parts = rev && rev.parts ? rev.parts : [];

    // Header
    document.getElementById('dm-num').textContent   = order.orderNumber || '—';
    document.getElementById('dm-title').textContent = order.title || '(без названия)';
    document.getElementById('dm-status-badge').innerHTML = statusBadge(order.status);

    // Stats strip
    document.getElementById('dm-client').textContent = order.customerName || '—';
    document.getElementById('dm-date').textContent   = fmtDate(order.createdAt);
    if (calc) {
      document.getElementById('dm-weight').textContent = fmtNum(calc.totalWeightKg, 1) + ' кг';
      document.getElementById('dm-mat').textContent    = fmtMoney(calc.totalMaterialCost);
      document.getElementById('dm-total').textContent  = fmtMoney(calc.totalCost);
    }

    // Description
    if (order.description && order.description.trim()) {
      document.getElementById('dm-desc').textContent = order.description;
      document.getElementById('dm-desc-section').style.display = '';
    } else {
      document.getElementById('dm-no-desc-section').style.display = '';
    }

    // BOM
    renderBom(parts, rev);

    // Contacts (async)
    if (order.customerId) {
      ERP.authFetch('/api/customers/' + order.customerId).then(function(r){ return r.json(); }).then(function(c) {
        renderContacts(c);
      }).catch(function(){ renderContacts(null); });
    } else {
      document.getElementById('dm-contacts').innerHTML = '<span class="dm-placeholder">Клиент не привязан</span>';
    }

  }).catch(function() {
    document.getElementById('dm-bom').innerHTML = '<span style="color:var(--red)">Ошибка загрузки данных</span>';
  });
}

function renderContacts(customer) {
  var el = document.getElementById('dm-contacts');
  if (!el) return;
  if (!customer) { el.innerHTML = '<span class="dm-placeholder">Не удалось загрузить</span>'; return; }

  var rows = [];
  // Top-level email/phone on customer
  if (customer.phone || customer.email) {
    rows.push(
      '<div class="dm-contact-card">' +
        '<div class="dm-contact-name">' + ERP.esc(customer.name) + '</div>' +
        (customer.phone ? '<div class="dm-contact-info">📞 ' + ERP.esc(customer.phone) + '</div>' : '') +
        (customer.email ? '<div class="dm-contact-info">✉ ' + ERP.esc(customer.email) + '</div>' : '') +
      '</div>'
    );
  }
  // Named contacts
  if (customer.contacts && customer.contacts.length) {
    customer.contacts.forEach(function(ct) {
      rows.push(
        '<div class="dm-contact-card">' +
          '<div class="dm-contact-name">' + ERP.esc(ct.name) +
            (ct.position ? ' <span class="dm-contact-pos">· ' + ERP.esc(ct.position) + '</span>' : '') +
          '</div>' +
          (ct.phone ? '<div class="dm-contact-info">📞 ' + ERP.esc(ct.phone) + '</div>' : '') +
          (ct.email ? '<div class="dm-contact-info">✉ ' + ERP.esc(ct.email) + '</div>' : '') +
        '</div>'
      );
    });
  }
  el.innerHTML = rows.length ? rows.join('') : '<span class="dm-placeholder">Контакты не добавлены</span>';
}

function renderBom(parts, rev) {
  var bomEl   = document.getElementById('dm-bom');
  var bomTitle = document.getElementById('dm-bom-title');

  if (rev) {
    bomTitle.textContent = 'Состав изделия · rev.' + rev.revisionNumber;
  }

  if (!parts || !parts.length) {
    bomEl.innerHTML = '<span class="dm-placeholder">' + (rev ? 'Позиции не добавлены' : 'Расчёт КП ещё не создан') + '</span>';
    return;
  }

  // Group by assembly
  var byAsm = {};
  var asmOrder = [];
  parts.forEach(function(p) {
    var key = p.assemblyName || 'Без узла';
    if (!byAsm[key]) { byAsm[key] = { parts: [], weight: 0, cost: 0 }; asmOrder.push(key); }
    byAsm[key].parts.push(p);
    byAsm[key].weight += Number(p.totalWeight || 0);
    byAsm[key].cost   += Number(p.materialCost || 0);
  });

  bomEl.innerHTML = asmOrder.map(function(asmName) {
    var asm = byAsm[asmName];
    return '<div class="dm-asm-block">' +
      '<div class="dm-asm-header">' +
        '<span class="dm-asm-icon">⬡</span>' +
        '<span class="dm-asm-name">' + ERP.esc(asmName) + '</span>' +
        '<span class="dm-asm-totals">' + fmtNum(asm.weight, 1) + ' кг · ' + fmtMoney(asm.cost) + '</span>' +
      '</div>' +
      '<div class="dm-parts-table">' +
        '<div class="dm-parts-head">' +
          '<span>Материал / позиция</span><span>Кол.</span><span>Вес, кг</span><span>Стоимость</span>' +
        '</div>' +
        asm.parts.map(function(p) {
          return '<div class="dm-part-row">' +
            '<span class="dm-part-name">' + ERP.esc(p.materialName || p.materialCode || '—') + '</span>' +
            '<span class="dm-part-qty">×' + (p.quantity || 1) + '</span>' +
            '<span class="dm-part-w">' + fmtNum(p.totalWeight, 2) + '</span>' +
            '<span class="dm-part-c">' + fmtMoney(p.materialCost) + '</span>' +
          '</div>';
        }).join('') +
      '</div>' +
    '</div>';
  }).join('');
}

function closeModal() {
  var bg = document.getElementById('deal-modal-bg');
  bg.classList.remove('open');
  setTimeout(function(){ bg.style.display = 'none'; }, 220);
}

/* ── Utils ────────────────────────────────────────────────────────────────── */
function filterCards(q) { filterQ = q; render(); }

function daysDiff(dateStr) {
  if (!dateStr) return 0;
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
}

document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });
load();
</script>
</body>
</html>

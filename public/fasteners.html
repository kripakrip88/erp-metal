<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МеталлПро ERP — Метизы</title>
<script src="nav.js"></script>
<style>
/* ── tabs ── */
.tab-row{display:flex;gap:2px;margin-bottom:16px;border-bottom:2px solid var(--brd);}
.tab-btn{background:none;border:none;padding:10px 20px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--txts);border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s;}
.tab-btn:hover{color:var(--txt);}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;border-radius:9px;background:var(--brd);color:var(--txts);font-size:11px;font-weight:700;padding:0 5px;margin-left:6px;}
.tab-btn.active .tab-badge{background:var(--blue);color:#fff;}

/* ── search + controls ── */
.ctrl-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.ctrl-search{position:relative;flex:1;min-width:200px;max-width:360px;}
.ctrl-search input{padding-left:30px;}
.ctrl-search .ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--txts);pointer-events:none;font-size:13px;}
.count-lbl{font-size:12px;color:var(--txts);margin-left:auto;}

/* ── filter bar ── */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:var(--bg2);border:1px solid var(--brd);border-radius:8px;margin-bottom:14px;}
.filter-bar select{font-size:12px;padding:4px 8px;min-width:110px;}
.filter-sep{color:var(--brd);margin:0 2px;}
.btn-reset-filters{font-size:12px;padding:4px 10px;margin-left:auto;}

/* ── table sort ── */
th.sortable{cursor:pointer;user-select:none;}
th.sortable:hover{color:var(--blue);}
th.sort-asc::after{content:' ▲';font-size:10px;color:var(--blue);}
th.sort-desc::after{content:' ▼';font-size:10px;color:var(--blue);}

/* ── weight warning ── */
.warn-weight{font-size:14px;cursor:help;}

/* ── pagination ── */
.pagination{display:flex;align-items:center;gap:6px;margin-top:14px;justify-content:flex-end;}
.pagination button{padding:4px 10px;font-size:12px;}
.pagination .pg-info{font-size:12px;color:var(--txts);}

/* ── detail modal ── */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;}
.detail-row{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px solid var(--brd);}
.detail-row:last-child{border-bottom:none;}
.detail-label{font-size:11px;color:var(--txts);margin-bottom:2px;}
.detail-val{font-size:13px;font-weight:500;}
.price-tag{display:inline-block;background:rgba(0,180,120,.12);color:#0ba070;border-radius:4px;padding:2px 8px;font-size:13px;font-weight:700;font-family:var(--font-mono,monospace);}
</style>
</head>
<body>
<div class="shell">
  <aside class="sb" id="erp-nav"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Метизы</div>
    </div>
    <div class="content">

      <!-- Tabs -->
      <div class="tab-row" id="tab-row">
        <button class="tab-btn active" data-type="Болт" onclick="setTab('Болт')">Болты <span class="tab-badge" id="badge-Болт">…</span></button>
        <button class="tab-btn" data-type="Гайка" onclick="setTab('Гайка')">Гайки <span class="tab-badge" id="badge-Гайка">…</span></button>
        <button class="tab-btn" data-type="Шайба" onclick="setTab('Шайба')">Шайбы <span class="tab-badge" id="badge-Шайба">…</span></button>
      </div>

      <!-- Search -->
      <div class="ctrl-row">
        <div class="ctrl-search">
          <span class="ico">🔍</span>
          <input type="text" id="search-inp" placeholder="Поиск по названию..." oninput="onSearch(this.value)">
        </div>
        <span class="count-lbl" id="mat-count"></span>
      </div>

      <!-- Filters -->
      <div class="filter-bar" id="filter-bar">
        <!-- populated by renderFilters() -->
      </div>

      <!-- Table -->
      <div class="card" style="overflow-x:auto">
        <table id="mat-table">
          <thead id="mat-thead"><tr></tr></thead>
          <tbody id="mat-tbody"></tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div id="modal-detail-bg" class="modal-bg" style="display:none" onclick="if(event.target===this)closeDetail()">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <div class="modal-title" id="detail-title">—</div>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>

<script>
ERP.init('fasteners');

// ── state ──────────────────────────────────────────────────────────────────
var state = {
  tab: 'Болт',
  search: '',
  filters: {},   // { diameter_mm:'', coating:'', ... }
  sortBy: '',
  sortDir: 'asc',
  page: 1,
  limit: 50,
};

var filterOptions = {};  // fetched per tab
var counts = { 'Болт': null, 'Гайка': null, 'Шайба': null };
var searchTimer = null;

// ── columns config ──────────────────────────────────────────────────────────
var COLUMNS = {
  'Болт': [
    { key: 'name',          label: 'Название',       sortKey: 'name' },
    { key: 'diameterMm',    label: 'Диаметр',        sortKey: 'diameter_mm',    fmt: fmtMm },
    { key: 'lengthMm',      label: 'Длина',          sortKey: 'length_mm',      fmt: fmtMm },
    { key: 'standard',      label: 'DIN' },
    { key: 'gost',          label: 'ГОСТ' },
    { key: 'strengthClass', label: 'Кл. прочн.',     sortKey: 'strength_class' },
    { key: 'threadType',    label: 'Резьба' },
    { key: 'coating',       label: 'Покрытие' },
    { key: '_weight',       label: 'Вес, г',         sortKey: '' },
    { key: '_price',        label: 'Цена, руб/шт',   sortKey: '' },
  ],
  'Гайка': [
    { key: 'name',          label: 'Название',       sortKey: 'name' },
    { key: 'diameterMm',    label: 'Диаметр',        sortKey: 'diameter_mm',    fmt: fmtMm },
    { key: 'standard',      label: 'DIN' },
    { key: 'gost',          label: 'ГОСТ' },
    { key: 'strengthClass', label: 'Кл. прочн.',     sortKey: 'strength_class' },
    { key: 'coating',       label: 'Покрытие' },
    { key: '_weight',       label: 'Вес, г',         sortKey: '' },
    { key: '_price',        label: 'Цена, руб/шт',   sortKey: '' },
  ],
  'Шайба': [
    { key: 'name',          label: 'Название',       sortKey: 'name' },
    { key: 'diameterMm',    label: 'Диаметр',        sortKey: 'diameter_mm',    fmt: fmtMm },
    { key: 'standard',      label: 'DIN' },
    { key: 'gost',          label: 'ГОСТ' },
    { key: 'coating',       label: 'Покрытие' },
    { key: '_weight',       label: 'Вес, г',         sortKey: '' },
    { key: '_price',        label: 'Цена, руб/шт',   sortKey: '' },
  ],
};

var FILTER_DEFS = {
  'Болт':  ['diameter_mm','coating','strength_class','din','thread_type','length_mm'],
  'Гайка': ['diameter_mm','coating','strength_class','din'],
  'Шайба': ['diameter_mm','coating','din'],
};

var FILTER_LABELS = {
  diameter_mm: 'Диаметр',
  length_mm:   'Длина',
  coating:     'Покрытие',
  strength_class: 'Класс прочн.',
  din:         'DIN',
  thread_type: 'Тип резьбы',
};

// ── init ────────────────────────────────────────────────────────────────────
async function init() {
  await Promise.all([
    loadBadgeCounts(),
    loadFilterOptions(),
  ]);
  renderFilters();
  renderTableHead();
  await loadMaterials();
}

async function loadBadgeCounts() {
  var types = ['Болт','Гайка','Шайба'];
  await Promise.all(types.map(function(t){
    var p = new URLSearchParams({ materialDomain:'FASTENER', fastener_type:t, limit:'1', page:'1' });
    return ERP.authFetch('/api/materials?' + p)
      .then(function(r){ return r.json(); })
      .then(function(d){ counts[t] = d.total || 0; updateBadge(t); })
      .catch(function(){});
  }));
}

function updateBadge(type) {
  var el = document.getElementById('badge-' + type);
  if (el && counts[type] !== null) el.textContent = counts[type];
}

async function loadFilterOptions() {
  try {
    var r = await ERP.authFetch('/api/materials/fastener-filters?fastener_type=' + encodeURIComponent(state.tab));
    filterOptions = await r.json();
  } catch(e) { filterOptions = {}; }
}

// ── tab switching ───────────────────────────────────────────────────────────
async function setTab(type) {
  state.tab = type;
  state.filters = {};
  state.sortBy = '';
  state.sortDir = 'asc';
  state.page = 1;

  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.type === type);
  });

  await loadFilterOptions();
  renderFilters();
  renderTableHead();
  await loadMaterials();
}

// ── filters ─────────────────────────────────────────────────────────────────
function renderFilters() {
  var bar = document.getElementById('filter-bar');
  var defs = FILTER_DEFS[state.tab] || [];
  if (!defs.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';

  var html = '';
  defs.forEach(function(key) {
    var opts = filterOptions[key] || [];
    if (!opts.length) return;
    var label = FILTER_LABELS[key] || key;
    html += '<select data-filter="'+key+'" onchange="onFilterChange(this)" title="'+label+'">';
    html += '<option value="">'+label+': Все</option>';
    opts.forEach(function(v){
      var sel = state.filters[key] === v ? ' selected' : '';
      html += '<option value="'+ERP.esc(v)+'"'+sel+'>'+ERP.esc(v)+'</option>';
    });
    html += '</select>';
  });

  html += '<button class="btn btn-secondary btn-reset-filters" onclick="resetFilters()">Сбросить</button>';
  bar.innerHTML = html;
}

function onFilterChange(sel) {
  state.filters[sel.dataset.filter] = sel.value;
  state.page = 1;
  loadMaterials();
}

function resetFilters() {
  state.filters = {};
  state.page = 1;
  renderFilters();
  loadMaterials();
}

// ── search ───────────────────────────────────────────────────────────────────
function onSearch(q) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){
    state.search = q;
    state.page = 1;
    loadMaterials();
  }, 280);
}

// ── sorting ──────────────────────────────────────────────────────────────────
function onSort(sortKey) {
  if (state.sortBy === sortKey) {
    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sortBy = sortKey;
    state.sortDir = 'asc';
  }
  state.page = 1;
  renderTableHead();
  loadMaterials();
}

// ── table head ────────────────────────────────────────────────────────────────
function renderTableHead() {
  var cols = COLUMNS[state.tab] || [];
  var thead = document.getElementById('mat-thead');
  var html = '<tr>';
  cols.forEach(function(col){
    if (col.sortKey !== undefined && col.sortKey !== '') {
      var cls = 'sortable';
      if (state.sortBy === col.sortKey) cls += ' sort-' + state.sortDir;
      html += '<th class="'+cls+'" onclick="onSort(\''+col.sortKey+'\')">'+col.label+'</th>';
    } else {
      html += '<th>'+col.label+'</th>';
    }
  });
  html += '</tr>';
  thead.innerHTML = html;
}

// ── load + render ─────────────────────────────────────────────────────────────
var currentItems = [];

async function loadMaterials() {
  var p = new URLSearchParams({
    materialDomain: 'FASTENER',
    fastener_type:  state.tab,
    page:           state.page,
    limit:          state.limit,
  });
  if (state.search)   p.set('search',   state.search);
  if (state.sortBy)  { p.set('sortBy',  state.sortBy); p.set('sortDir', state.sortDir); }
  Object.keys(state.filters).forEach(function(k){
    if (state.filters[k]) p.set(k, state.filters[k]);
  });

  try {
    var r = await ERP.authFetch('/api/materials?' + p);
    var data = await r.json();
    currentItems = data.items || [];
    renderTable(currentItems);
    renderPagination(data);
    var total = data.total || 0;
    document.getElementById('mat-count').textContent = total + ' позиций';
  } catch(e) { ERP.toast('Ошибка загрузки: ' + e.message, 'error'); }
}

function fmtMm(v) {
  if (v == null) return '—';
  var n = parseFloat(v);
  return isNaN(n) ? '—' : (Number.isInteger(n) ? n : n.toFixed(1)) + ' мм';
}

function getCellValue(m, col) {
  if (col.key === '_weight') {
    var geo = m.geometry || {};
    if (m.weightRequired || geo.unitWeightKg == null) {
      return '<span title="Вес не определён — требует уточнения">⚠️</span>';
    }
    var kg = parseFloat(geo.unitWeightKg);
    return isNaN(kg) ? '—' : (kg * 1000).toFixed(2) + ' г';
  }
  if (col.key === '_price') {
    var pp = m.procurementProfiles && m.procurementProfiles[0];
    if (!pp || pp.pricePerPiece == null) return '<span style="color:var(--txts)">—</span>';
    return '<span class="mono" style="color:var(--green,#0ba070)">' + parseFloat(pp.pricePerPiece).toFixed(2) + '</span>';
  }
  var v = m[col.key];
  if (v == null || v === '') return '<span style="color:var(--txts)">—</span>';
  if (col.fmt) return ERP.esc(col.fmt(v));
  return ERP.esc(String(v));
}

function renderTable(items) {
  var cols = COLUMNS[state.tab] || [];
  var tbody = document.getElementById('mat-tbody');

  if (!items.length) {
    tbody.innerHTML = '<tr><td colspan="'+cols.length+'"><div class="empty">Метизов не найдено</div></td></tr>';
    return;
  }

  tbody.innerHTML = items.map(function(m, idx){
    var cells = cols.map(function(col){ return '<td>'+getCellValue(m, col)+'</td>'; }).join('');
    return '<tr class="clickable" onclick="openDetail('+idx+')">'+cells+'</tr>';
  }).join('');
}

// ── pagination ────────────────────────────────────────────────────────────────
function renderPagination(data) {
  var pg = document.getElementById('pagination');
  var pages = data.pages || 1;
  var page  = data.page  || 1;
  if (pages <= 1) { pg.innerHTML = ''; return; }

  var html = '<button class="btn btn-secondary btn-xs" '+(page<=1?'disabled':'')+' onclick="goPage('+( page-1)+')">← Пред.</button>';
  html += '<span class="pg-info">стр. '+page+' / '+pages+'</span>';
  html += '<button class="btn btn-secondary btn-xs" '+(page>=pages?'disabled':'')+' onclick="goPage('+(page+1)+')">След. →</button>';
  pg.innerHTML = html;
}

function goPage(p) {
  state.page = p;
  loadMaterials();
  window.scrollTo(0, 0);
}

// ── detail modal ──────────────────────────────────────────────────────────────
function openDetail(idx) {
  var m = currentItems[idx];
  if (!m) return;

  document.getElementById('detail-title').textContent = m.name;

  var geo = m.geometry || {};
  var pp  = m.procurementProfiles && m.procurementProfiles[0];
  var weightG = (geo.unitWeightKg != null && !m.weightRequired)
    ? (parseFloat(geo.unitWeightKg) * 1000).toFixed(3) + ' г'
    : '⚠️ не определён';
  var price = (pp && pp.pricePerPiece != null)
    ? '<span class="price-tag">' + parseFloat(pp.pricePerPiece).toFixed(4) + ' руб/шт</span>'
    : '—';
  var supplierNote = pp && pp.notes ? '<br><small style="color:var(--txts)">'+ERP.esc(pp.notes)+'</small>' : '';

  var rows = [
    ['Тип метиза',    m.fastenerType],
    ['Диаметр',       fmtMm(m.diameterMm)],
    ['Длина',         fmtMm(m.lengthMm)],
    ['DIN / Стандарт', m.standard],
    ['ГОСТ',          m.gost],
    ['Класс прочности', m.strengthClass],
    ['Тип резьбы',    m.threadType],
    ['Покрытие',      m.coating],
    ['Вес 1 шт',      weightG + (m.weightNote ? ' <small style="color:var(--txts)">('+ERP.esc(m.weightNote)+')</small>' : '')],
    ['Цена',          price + supplierNote],
    ['Поставщик',     pp ? ERP.esc(pp.supplierName || '') : '—'],
  ];

  var html = '<div class="detail-grid">';
  rows.forEach(function(row){
    var val = row[1] == null || row[1] === '' ? '—' : row[1];
    html += '<div class="detail-row"><span class="detail-label">'+row[0]+'</span><span class="detail-val">'+val+'</span></div>';
  });
  html += '</div>';

  document.getElementById('detail-body').innerHTML = html;
  document.getElementById('modal-detail-bg').style.display = 'flex';
}

function closeDetail() {
  document.getElementById('modal-detail-bg').style.display = 'none';
}

document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDetail(); });

init();
</script>
</body>
</html>

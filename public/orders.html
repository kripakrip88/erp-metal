<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МеталлПро ERP — Журнал заказов</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--surface:#fff;--border:#e2e5ea;--border2:#c8cdd6;--text:#1a1d23;--muted:#6b7280;--accent:#2563eb;--accent-h:#1d4ed8;--green:#16a34a;--red:#dc2626;--yellow:#d97706;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Manrope',sans-serif;font-size:13px;background:var(--bg);color:var(--text);line-height:1.5;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:204px;background:var(--surface);border-right:1px solid var(--border);flex-shrink:0;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;}
.logo{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:800;font-size:14px;color:var(--accent);}
.logo span{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:2px;}
nav{padding:8px;flex:1;}
.nav-group{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:10px 8px 4px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;font-size:12.5px;transition:all .1s;margin-bottom:1px;text-decoration:none;}
.nav-item:hover{background:var(--bg);color:var(--text);}
.nav-item.active{background:#eff6ff;color:var(--accent);font-weight:600;}
.sidebar-bottom{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);}
.main{margin-left:204px;flex:1;}
.topbar{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:20;}
.topbar-title{font-weight:700;font-size:14px;}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.content{padding:20px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-family:'Manrope';font-size:12.5px;font-weight:600;transition:all .12s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:var(--accent-h);}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border2);}.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:#fef2f2;color:var(--red);border:1px solid #fecaca;}.btn-danger:hover{background:#fee2e2;}
.btn-sm{padding:4px 10px;font-size:12px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:#fafbfc;}
.card-title{font-weight:700;font-size:13px;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
input,select{border:1px solid var(--border2);border-radius:5px;padding:7px 10px;font-family:'Manrope';font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border-color .12s,box-shadow .12s;}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
input.inp-error{border-color:var(--red);}
.field-hint{font-size:11px;color:var(--muted);}
.field-error{font-size:11px;color:var(--red);display:none;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
table{width:100%;border-collapse:collapse;}
thead th{padding:8px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:#fafbfc;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none;}
thead th.sortable{cursor:pointer;}
thead th.sortable:hover{color:var(--text);}
thead th.sort-active{color:var(--accent);}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#fafbfc;}
td{padding:9px 12px;vertical-align:middle;}
.mono{font-family:'JetBrains Mono';font-size:11.5px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}
.s-active{background:#f0fdf4;color:#16a34a;}
.s-archived{background:#fef2f2;color:#dc2626;}
.chip-w{font-family:'JetBrains Mono';font-size:11.5px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:4px;padding:1px 7px;}
.chip-c{font-family:'JetBrains Mono';font-size:11.5px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;border-radius:4px;padding:1px 7px;}
.chip-p{font-family:'JetBrains Mono';font-size:11.5px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:4px;padding:1px 7px;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:4px;}
.stat-val{font-size:20px;font-weight:800;color:var(--text);}
.stat-val.accent{color:var(--accent);}
.stat-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:340px;}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.search-input{width:100%;height:34px;padding:0 10px 0 28px;background:var(--surface);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-family:'Manrope';font-size:13px;outline:none;transition:border-color .12s;}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
.search-input::placeholder{color:var(--muted);}
.filter-sel{height:34px;padding:0 8px;background:var(--surface);border:1px solid var(--border2);border-radius:5px;color:var(--muted);font-family:'Manrope';font-size:12.5px;outline:none;cursor:pointer;}
.count-label{font-size:12px;color:var(--muted);margin-left:auto;}
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty .icon{font-size:32px;margin-bottom:8px;}
.empty .title{font-weight:700;font-size:14px;color:var(--text);margin-bottom:4px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-weight:700;font-size:15px;}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px;line-height:1;border-radius:4px;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:20px;}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.detail-field{background:var(--bg);border-radius:6px;padding:10px 12px;}
.detail-field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:3px;}
.detail-field-value{font-size:13px;font-weight:600;}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.rev-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:6px;border:1px solid var(--border);margin-bottom:6px;background:var(--bg);}
.rev-item.rev-active{background:#f0fdf4;border-color:#86efac;}
.rev-label{font-family:'JetBrains Mono';font-size:12px;font-weight:700;color:var(--muted);min-width:28px;}
.rev-item.rev-active .rev-label{color:var(--green);}
.rev-note{font-size:12px;color:var(--text);flex:1;}
.rev-stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.rev-date{font-size:11px;color:var(--muted);font-family:'JetBrains Mono';white-space:nowrap;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;border-radius:7px;padding:12px 16px;font-size:13px;font-weight:500;z-index:1000;display:flex;align-items:center;gap:8px;transform:translateY(10px);opacity:0;transition:all .2s;max-width:340px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{background:#15803d;}.toast.error{background:var(--red);}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="logo">МеталлПро ERP <span>Рабочий стенд v1.0</span></div>
  <nav>
    <div class="nav-group">Workflow</div>
    <a class="nav-item active" href="orders.html"><span>📋</span> Журнал заказов</a>
    <a class="nav-item" href="simulator.html"><span>🧮</span> Расчёт КП</a>
    <div class="nav-group">Справочники</div>
    <a class="nav-item" href="simulator.html"><span>🔩</span> Материалы</a>
    <a class="nav-item" href="simulator.html"><span>💰</span> Цены</a>
  </nav>
  <div class="sidebar-bottom">МеталлПро ERP · v1.0</div>
</aside>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">Журнал заказов</div>
    <div class="topbar-right">
      <button class="btn btn-primary" onclick="openCreateModal()">+ Новый заказ</button>
    </div>
  </div>
  <div class="content">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="controls">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="search" placeholder="Поиск по номеру, заказчику, объекту..." oninput="render()">
      </div>
      <select class="filter-sel" id="sort-sel" onchange="render()">
        <option value="date-desc">Дата ↓</option>
        <option value="date-asc">Дата ↑</option>
        <option value="num-desc">Номер ↓</option>
        <option value="num-asc">Номер ↑</option>
        <option value="weight-desc">Вес ↓</option>
      </select>
      <select class="filter-sel" id="status-sel" onchange="render()">
        <option value="active">Активные</option>
        <option value="all">Все</option>
        <option value="archived">Архив</option>
      </select>
      <span class="count-label" id="count-label"></span>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th class="sortable" onclick="setSort('num')">№ заказа <span id="si-num"></span></th>
            <th>Заказчик</th>
            <th>Объект</th>
            <th class="sortable" onclick="setSort('weight')">Вес <span id="si-weight"></span></th>
            <th class="sortable" onclick="setSort('date')">Дата <span id="si-date"></span></th>
            <th>Ревизия</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty-state" style="display:none"></div>
    </div>
  </div>
</div>
</div>

<div id="modal-bg" class="modal-bg" style="display:none" onclick="handleBgClick(event)">
  <div class="modal"><div id="modal-inner"></div></div>
</div>
<div class="toast" id="toast"></div>

<script src="erp-store.js"></script>
<script>
let sortField='date',sortDir='desc';

function setSort(f){
  if(sortField===f)sortDir=sortDir==='asc'?'desc':'asc';
  else{sortField=f;sortDir='desc';}
  document.getElementById('sort-sel').value=sortField+'-'+sortDir;
  render();
}

function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const sv=document.getElementById('sort-sel').value.split('-');
  sortField=sv[0];sortDir=sv[1];
  const sf=document.getElementById('status-sel').value;
  let orders=ERPStore.getAllOrders();
  if(sf==='active')orders=orders.filter(o=>o.status!=='archived');
  else if(sf==='archived')orders=orders.filter(o=>o.status==='archived');
  if(q)orders=orders.filter(o=>String(o.number).toLowerCase().includes(q)||(o.client||'').toLowerCase().includes(q)||(o.object||'').toLowerCase().includes(q));
  orders.sort((a,b)=>{
    const va=sortField==='date'?new Date(a.createdAt).getTime():sortField==='num'?parseFloat(a.number)||0:(a.weightKg||0);
    const vb=sortField==='date'?new Date(b.createdAt).getTime():sortField==='num'?parseFloat(b.number)||0:(b.weightKg||0);
    return sortDir==='asc'?va-vb:vb-va;
  });
  ['num','weight','date'].forEach(f=>{
    const el=document.getElementById('si-'+f);const th=el?.closest('th');
    if(!el)return;
    el.textContent=sortField===f?(sortDir==='asc'?'↑':'↓'):'';
    th?.classList.toggle('sort-active',sortField===f);
  });
  const all=ERPStore.getAllOrders().filter(o=>o.status!=='archived');
  const totalW=all.reduce((s,o)=>s+(o.weightKg||0),0);
  const thisMonth=all.filter(o=>new Date(o.createdAt).getMonth()===new Date().getMonth()).length;
  const totalRevs=all.reduce((s,o)=>s+(o.revisions?.length||0),0);
  document.getElementById('stats-grid').innerHTML=`
    <div class="stat-card"><div class="stat-label">Активных заказов</div><div class="stat-val accent">${all.length}</div></div>
    <div class="stat-card"><div class="stat-label">Общий вес</div><div class="stat-val">${ERPStore.formatWeight(totalW)}</div></div>
    <div class="stat-card"><div class="stat-label">За этот месяц</div><div class="stat-val">${thisMonth}</div><div class="stat-sub">новых заказов</div></div>
    <div class="stat-card"><div class="stat-label">Всего ревизий</div><div class="stat-val">${totalRevs}</div></div>`;
  document.getElementById('count-label').textContent=orders.length?`${orders.length} заказов`:'';
  const tbody=document.getElementById('tbody');
  const empty=document.getElementById('empty-state');
  if(!orders.length){
    tbody.innerHTML='';
    empty.style.display='block';
    empty.innerHTML=`<div class="empty"><div class="icon">📋</div><div class="title">${q?'Ничего не найдено':'Заказов пока нет'}</div><div>${q?'Попробуйте изменить запрос':'Нажмите «+ Новый заказ»'}</div></div>`;
    return;
  }
  empty.style.display='none';
  tbody.innerHTML=orders.map(o=>{
    const rev=ERPStore.getActiveRevision(o);
    return`<tr onclick="window.location.href=ERPStore.buildSimulatorURL('${o.id}')">
      <td><span class="mono" style="color:var(--accent);font-weight:700">${esc(o.number)}</span></td>
      <td><span style="font-weight:600">${esc(o.client||'—')}</span></td>
      <td><span style="color:var(--muted)">${esc(o.object||'—')}</span></td>
      <td><span class="chip-w">${ERPStore.formatWeight(o.weightKg||0)}</span></td>
      <td><span class="mono" style="color:var(--muted);font-size:11px">${ERPStore.formatDate(o.createdAt)}</span></td>
      <td><span class="badge s-active">${esc(rev?.label||'R1')}</span></td>
    </tr>`;
  }).join('');
}

function openCreateModal(){
  document.getElementById('modal-inner').innerHTML=`
    <div class="modal-header"><div class="modal-title">Новый заказ</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="grid2">
        <div class="field"><label>Номер заказа *</label><input id="f-num" placeholder="например, 1045" autocomplete="off"><span class="field-error" id="err-num"></span></div>
        <div class="field"><label>Вес, кг</label><input id="f-weight" type="number" placeholder="0" min="0" step="0.1"><span class="field-hint">Уточняется после расчёта</span></div>
      </div>
      <div class="field"><label>Заказчик</label><input id="f-client" placeholder="Название компании"></div>
      <div class="field"><label>Объект</label><input id="f-object" placeholder="Наименование объекта"></div>
      <div class="field"><label>Примечание к R1</label><input id="f-note" placeholder="Первичный расчёт"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveOrder()">Создать заказ</button>
    </div>`;
  document.getElementById('modal-bg').style.display='flex';
  setTimeout(()=>document.getElementById('f-num').focus(),50);
}

function saveOrder(){
  const numEl=document.getElementById('f-num');
  const errEl=document.getElementById('err-num');
  const number=numEl.value.trim();
  numEl.classList.remove('inp-error');errEl.style.display='none';
  if(!number){numEl.classList.add('inp-error');errEl.textContent='Введите номер заказа';errEl.style.display='block';numEl.focus();return;}
  const result=ERPStore.createOrder({number,client:document.getElementById('f-client').value,object:document.getElementById('f-object').value,weightKg:parseFloat(document.getElementById('f-weight').value)||0,note:document.getElementById('f-note').value});
  if(!result.ok){numEl.classList.add('inp-error');errEl.textContent=result.error;errEl.style.display='block';return;}
  closeModal();render();toast('Заказ '+number+' создан','success');
}

function openDetail(id){
  const o=ERPStore.getOrderById(id);if(!o)return;
  const revs=(o.revisions||[]).slice().reverse().map(r=>`
    <div class="rev-item ${r.active?'rev-active':''}">
      <div class="rev-label">${esc(r.label)}</div>
      <div style="flex:1">
        <div class="rev-note">${esc(r.note||'')}</div>
        <div class="rev-stats">
          ${r.totalWeightKg?`<span class="chip-w" style="font-size:10.5px">${ERPStore.formatWeight(r.totalWeightKg)}</span>`:''}
          ${r.totalCostRub?`<span class="chip-c" style="font-size:10.5px">${ERPStore.formatMoney(r.totalCostRub)}</span>`:''}
          ${r.totalPaintM2?`<span class="chip-p" style="font-size:10.5px">${r.totalPaintM2.toFixed(1)} м²</span>`:''}
        </div>
      </div>
      <div class="rev-date">${ERPStore.formatDate(r.createdAt)}</div>
    </div>`).join('');
  document.getElementById('modal-inner').innerHTML=`
    <div class="modal-header"><div class="modal-title">Заказ № ${esc(o.number)}</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="detail-grid">
        <div class="detail-field"><div class="detail-field-label">Заказчик</div><div class="detail-field-value">${esc(o.client||'—')}</div></div>
        <div class="detail-field"><div class="detail-field-label">Объект</div><div class="detail-field-value">${esc(o.object||'—')}</div></div>
        <div class="detail-field"><div class="detail-field-label">Общий вес</div><div class="detail-field-value">${ERPStore.formatWeight(o.weightKg||0)}</div></div>
        <div class="detail-field"><div class="detail-field-label">Создан</div><div class="detail-field-value">${ERPStore.formatDate(o.createdAt)}</div></div>
      </div>
      <div class="section-label">История ревизий</div>
      ${revs||'<div style="color:var(--muted);font-size:13px;padding:8px 0">Нет ревизий</div>'}
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" onclick="archiveConfirm('${o.id}')">Архивировать</button>
      <button class="btn btn-secondary" onclick="addRevision('${o.id}')">+ Новая ревизия</button>
      <button class="btn btn-primary" onclick="openInSimulator('${o.id}')">✏️ Открыть расчёт</button>
    </div>`;
  document.getElementById('modal-bg').style.display='flex';
}

function openInSimulator(id){window.location.href=ERPStore.buildSimulatorURL(id);}

function addRevision(id){
  const note=prompt('Примечание к новой ревизии:')||'Пересчёт';
  const result=ERPStore.addRevision(id,{note});
  if(!result.ok){toast(result.error,'error');return;}
  render();openDetail(id);toast('Создана ревизия '+result.revision.label,'success');
}

function archiveConfirm(id){
  if(!confirm('Архивировать заказ? Данные сохранятся.'))return;
  ERPStore.archiveOrder(id);closeModal();render();toast('Заказ архивирован','success');
}

function closeModal(){document.getElementById('modal-bg').style.display='none';}
function handleBgClick(e){if(e.target===document.getElementById('modal-bg'))closeModal();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let _tt;
function toast(msg,type='success'){const el=document.getElementById('toast');el.textContent=(type==='success'?'✓ ':'✗ ')+msg;el.className=`toast ${type} show`;clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),3000);}

render();
</script>
</body>
</html>
